<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Baldur's Gate 3 Today</title>
  <style>
    :root {
      --bg-1: #09030f;
      --bg-2: #241021;
      --gold: #f3c969;
      --red: #b62232;
      --text: #fff7e6;
      --muted: #d8b98a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--text);
      font-family: Georgia, 'Times New Roman', serif;
      background:
        radial-gradient(circle at 50% 25%, rgba(246, 80, 55, 0.22), transparent 32rem),
        radial-gradient(circle at 20% 80%, rgba(153, 37, 55, 0.25), transparent 28rem),
        linear-gradient(135deg, var(--bg-1), var(--bg-2) 55%, #07040b);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: -20vmax;
      pointer-events: none;
      background:
        conic-gradient(from 0deg, transparent, rgba(243, 201, 105, 0.10), transparent, rgba(182, 34, 50, 0.12), transparent);
      animation: slowSpin 28s linear infinite;
      filter: blur(3px);
    }

    body::after {
      animation-duration: 46s;
      animation-direction: reverse;
      opacity: 0.45;
    }

    @keyframes slowSpin {
      to { transform: rotate(360deg); }
    }

    main {
      position: relative;
      z-index: 1;
      width: min(96vw, 1200px);
      padding: clamp(1.5rem, 5vw, 4rem);
      text-align: center;
      border: 1px solid rgba(243, 201, 105, 0.32);
      border-radius: 32px;
      background: rgba(8, 3, 15, 0.66);
      box-shadow:
        0 0 80px rgba(182, 34, 50, 0.28),
        inset 0 0 50px rgba(243, 201, 105, 0.05);
      backdrop-filter: blur(14px);
    }

    .eyebrow {
      margin: 0 0 0.75rem;
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.9rem, 2vw, 1.2rem);
      letter-spacing: 0.35em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.4rem, 10vw, 9rem);
      line-height: 0.88;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--gold);
      text-shadow:
        0 0 18px rgba(243, 201, 105, 0.25),
        0 5px 0 rgba(0, 0, 0, 0.42),
        0 14px 34px rgba(182, 34, 50, 0.45);
    }

    .timer {
      margin: clamp(2rem, 6vw, 4rem) 0 1rem;
      display: flex;
      justify-content: center;
      gap: clamp(0.7rem, 2vw, 1.5rem);
      flex-wrap: wrap;
      font-family: Arial, Helvetica, sans-serif;
    }

    .unit {
      min-width: clamp(120px, 18vw, 230px);
      padding: clamp(1rem, 3vw, 2rem);
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.025));
      border: 1px solid rgba(243, 201, 105, 0.22);
      box-shadow: inset 0 0 22px rgba(0, 0, 0, 0.35);
    }

    .number {
      display: block;
      font-size: clamp(4rem, 11vw, 10rem);
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: -0.06em;
      font-variant-numeric: tabular-nums;
      color: #fff2c9;
      text-shadow: 0 0 28px rgba(243, 201, 105, 0.28);
    }

    .label {
      display: block;
      margin-top: 0.75rem;
      color: var(--muted);
      font-size: clamp(0.8rem, 1.7vw, 1rem);
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .status {
      min-height: 1.5em;
      margin: 1.3rem 0 0;
      color: #ffe0a3;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(1.1rem, 3vw, 2rem);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .sigil {
      position: fixed;
      width: 44vmax;
      height: 44vmax;
      border: 2px solid rgba(243, 201, 105, 0.08);
      border-radius: 50%;
      z-index: 0;
      animation: pulse 4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.45; }
      50% { transform: scale(1.06); opacity: 0.75; }
    }

    .done h1 {
      animation: glow 1.2s ease-in-out infinite alternate;
    }

    @keyframes glow {
      to {
        text-shadow:
          0 0 28px rgba(243, 201, 105, 0.58),
          0 0 70px rgba(182, 34, 50, 0.62),
          0 6px 0 rgba(0, 0, 0, 0.42);
      }
    }
  </style>
</head>
<body>
  <div class="sigil"></div>
  <main id="card">
    <p class="eyebrow">Countdown to 8:00 PM</p>
    <h1>BALDUR'S GATE 3 TODAY</h1>

    <section class="timer" aria-label="Countdown timer">
      <div class="unit">
        <span id="hours" class="number">00</span>
        <span class="label">Hours</span>
      </div>
      <div class="unit">
        <span id="minutes" class="number">00</span>
        <span class="label">Minutes</span>
      </div>
      <div class="unit">
        <span id="seconds" class="number">00</span>
        <span class="label">Seconds</span>
      </div>
    </section>

    <p id="status" class="status">The party gathers soon.</p>
  </main>

  <script>
    const target = new Date('2026-06-23T20:00:00+02:00');
    const card = document.getElementById('card');
    const status = document.getElementById('status');
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');

    function pad(value) {
      return String(value).padStart(2, '0');
    }

    function updateTimer() {
      const now = new Date();
      const diff = target - now;

      if (diff <= 0) {
        hoursEl.textContent = '00';
        minutesEl.textContent = '00';
        secondsEl.textContent = '00';
        status.textContent = "It's time. Roll initiative.";
        card.classList.add('done');
        return;
      }

      const totalSeconds = Math.floor(diff / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      hoursEl.textContent = pad(hours);
      minutesEl.textContent = pad(minutes);
      secondsEl.textContent = pad(seconds);
    }

    updateTimer();
    setInterval(updateTimer, 1000);
  </script>
</body>
</html>
